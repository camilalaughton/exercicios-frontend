<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Troco</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="card">
            <h1>Calculadora de Troco</h1>
            <p class="intro">Informe o valor do produto e o valor pago para calcular o troco.</p>

            <form>
                <div class="field">
                    <label for="valorproduto">Valor do produto (R$)</label>
                    <input type="text" name="valorproduto" id="valorproduto" placeholder="Ex: 100" inputmode="decimal" required>
                </div>

                <div class="field">
                    <label for="valorpago">Valor pago (R$)</label>
                    <input type="text" name="valorpago" id="valorpago" placeholder="Ex: 200" inputmode="decimal" required>
                </div>

                <button type="button" id="btn">Calcular</button>
            </form>

            <div class="result">
                <p id="resultado"></p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
