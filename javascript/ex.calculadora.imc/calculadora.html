<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="card">
            <h1>Calculadora de IMC</h1>
            <p class="intro">Informe sua altura e peso para calcular seu Índice de Massa Corporal.</p>

            <form>
                <div class="field">
                    <label for="height">Altura (m)</label>
                    <input type="text" name="height" id="height" placeholder="1.75" inputmode="decimal" required>
                </div>

                <div class="field">
                    <label for="weight">Peso (kg)</label>
                    <input type="text" name="weight" id="weight" placeholder="70" inputmode="decimal" required>
                </div>

                <button type="button" id="btn">Calcular</button>
            </form>

            <div class="result" id="result-box">
                <p id="resultado"></p>
                <p id="categoria"></p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
