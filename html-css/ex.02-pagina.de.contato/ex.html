<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Contato</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Fale Conosco</h1>
        <nav>
            <a href="#">Início</a>
            <a href="#">Conteúdos</a>
            <a href="#">Contato</a>
            <a href="#">Dúvidas</a>
            <a href="#">Extra</a>
        </nav>
    </header>

    <main>
        <section class="contact-card">
            <p class="intro">Preencha o formulário abaixo e retornaremos em breve</p>
            <form action="#" method="post">
                <div class="field">
                    <label for="name">Nome</label>
                    <input type="text" name="name" id="name" class="inputs" placeholder="Seu nome completo">
                </div>

                <div class="field">
                    <label for="email">E-mail</label>
                    <input type="email" name="email" id="email" class="inputs" placeholder="voce@email.com">
                </div>

                <div class="field">
                    <label for="subject">Assunto</label>
                    <select name="subject" id="subject" class="inputs">
                        <option value="duvida">Dúvida</option>
                        <option value="sugestao">Sugestão</option>
                        <option value="reclamacao">Reclamação</option>
                    </select>
                </div>

                <div class="field">
                    <label for="text">Mensagem</label>
                    <textarea name="text" id="text" class="inputs" rows="5" placeholder="Escreva sua mensagem em detalhes"></textarea>
                </div>

                <input type="submit" value="Enviar mensagem" class="button">
            </form>
        </section>
    </main>

    <footer>Todos os direitos reservados &copy;</footer>
</body>
</html>
