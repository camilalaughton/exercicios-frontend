<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Personagem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="card">
            <h1>Ficha de Personagem</h1>
            <p class="intro">Informe os atributos para calcular ataque, defesa e nível do personagem.</p>

            <form>
                <div class="field">
                    <label for="nome">Nome</label>
                    <input type="text" name="nome" id="nome" placeholder="Nome do personagem" required>
                </div>

                <div class="field">
                    <label for="forca">Força (1–10)</label>
                    <input type="number" name="forca" id="forca" min="1" max="10" required>
                </div>

                <div class="field">
                    <label for="agilidade">Agilidade (1–10)</label>
                    <input type="number" name="agilidade" id="agilidade" min="1" max="10" required>
                </div>

                <div class="field">
                    <label for="nivel">Nível (1–10)</label>
                    <input type="number" name="nivel" id="nivel" min="1" max="10" required>
                </div>

                <button type="button" id="btn">Calcular</button>
            </form>

            <p id="erro" class="erro"></p>

            <div id="resultado" class="result">
                <p id="resultNome"></p>
                <p id="resultAtaque"></p>
                <p id="resultDefesa"></p>
                <p id="resultStatus"></p>
                <p id="resultNivel"></p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
